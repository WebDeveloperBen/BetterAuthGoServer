# Air configuration for hot reload
# Install: go install github.com/air-verse/air@latest
# Run: air

root = "."
tmp_dir = "tmp"

[build]
  # Build command
  cmd = "go build -o ./tmp/main ."
  # Binary file
  bin = "./tmp/main"
  # Watch these extensions
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  # Exclude these directories
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules"]
  # Exclude these files
  exclude_file = []
  # Exclude regex patterns
  exclude_regex = ["_test.go", ".*_templ.go"]
  # Exclude unchanged files
  exclude_unchanged = false
  # Follow symlinks
  follow_symlink = false
  # Delay after file change (ms)
  delay = 500
  # Stop running old binary before building
  stop_on_error = true
  # Send interrupt signal before killing
  send_interrupt = true
  # Delay after sending interrupt (ms)
  kill_delay = 500
  # Rerun binary with args
  args_bin = []
  # Build/Binary on startup
  full_bin = ""
  # Log build time
  log = "build-errors.log"

[color]
  # Colorize output
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  # Show log time
  time = false
  # Log level (debug, info, warn, error)
  main_only = false

[misc]
  # Clean tmp on exit
  clean_on_exit = true

[screen]
  # Clear screen on rebuild
  clear_on_rebuild = true
  # Keep scroll position
  keep_scroll = true
