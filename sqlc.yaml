version: "2"
sql:
  # PostgreSQL
  - engine: "postgresql"
    queries: "db/queries/postgres/"
    schema: "db/schema/postgres/"
    gen:
      go:
        package: "pgstore"
        out: "db/pgstore"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"

  # SQLite
  - engine: "sqlite"
    queries: "db/queries/sqlite/"
    schema: "db/schema/sqlite/"
    gen:
      go:
        package: "sqlitestore"
        out: "db/sqlitestore"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
