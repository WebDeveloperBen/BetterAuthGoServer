services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auth server (production build)
  auth:
    build: .
    container_name: auth-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://auth:authpass@postgres:5432/authdb?sslmode=disable
      AUTH_SECRET: your-super-secret-key-min-32-chars!
      BASE_URL: http://localhost:8080
      PORT: "8080"
    ports:
      - "8080:8080"

  # Development mode with hot reload
  auth-dev:
    image: golang:1.23-alpine
    container_name: auth-dev
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://auth:authpass@postgres:5432/authdb?sslmode=disable
      AUTH_SECRET: your-super-secret-key-min-32-chars!
      BASE_URL: http://localhost:8080
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
    command: >
      sh -c "apk add --no-cache gcc musl-dev &&
             go install github.com/air-verse/air@latest &&
             air"
    profiles:
      - dev

volumes:
  postgres_data:
  go_mod_cache:
