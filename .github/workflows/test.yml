name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Unit tests (fast, no containers)
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        env:
          TEST_POSTGRES: "false"
          TEST_MYSQL: "false"
          TEST_SQLITE: "false"
        run: |
          go test -v -race -short ./...

  # Integration/E2E tests with dialect matrix
  integration:
    name: Integration (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql, sqlite]
        include:
          - dialect: postgres
            env_postgres: "true"
            env_mysql: "false"
            env_sqlite: "false"
          - dialect: mysql
            env_postgres: "false"
            env_mysql: "true"
            env_sqlite: "false"
          - dialect: sqlite
            env_postgres: "false"
            env_mysql: "false"
            env_sqlite: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        env:
          TEST_POSTGRES: ${{ matrix.env_postgres }}
          TEST_MYSQL: ${{ matrix.env_mysql }}
          TEST_SQLITE: ${{ matrix.env_sqlite }}
        run: |
          go test -v ./tests/e2e/... ./migrate/...

  # All tests must pass
  test-complete:
    name: All Tests
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - name: All tests passed
        run: echo "All tests passed successfully!"
