version: "2"
sql:
  # PostgreSQL
  - engine: "postgresql"
    queries: "queries/postgres/"
    schema: "schema/postgres/"
    gen:
      go:
        package: "pgstore"
        out: "pgstore"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"

  # SQLite
  - engine: "sqlite"
    queries: "queries/sqlite/"
    schema: "schema/sqlite/"
    gen:
      go:
        package: "sqlitestore"
        out: "sqlitestore"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true

  # MySQL
  - engine: "mysql"
    queries: "queries/mysql/"
    schema: "schema/mysql/"
    gen:
      go:
        package: "mysqlstore"
        out: "mysqlstore"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
