version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/postgres/"
    schema: "schema/postgres/"
    gen:
      go:
        package: "pgstore"
        out: "pgstore"
        emit_json_tags: true
        emit_empty_slices: true
  - engine: "sqlite"
    queries: "queries/sqlite/"
    schema: "schema/sqlite/"
    gen:
      go:
        package: "sqlitestore"
        out: "sqlitestore"
        emit_json_tags: true
        emit_empty_slices: true
